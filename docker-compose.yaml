services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=4445
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/data/smart-kpi.db
    ports:
      - "4445:4445"
    volumes:
      - kpi_data:/data

volumes:
  kpi_data:
